<div class="relative">
    @if (status.isLoading()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/20">
        <div class="rounded bg-white px-4 py-3 text-sm font-medium shadow">Loading...</div>
    </div>
    }

    @if (status.errorMessage()) {
    <div class="fixed top-4 left-1/2 z-50 w-full max-w-lg -translate-x-1/2 px-4">
        <div class="rounded border border-red-300 bg-red-50 p-4 text-sm text-red-700 shadow">
            {{ status.errorMessage() }}
        </div>
    </div>
    }

    <router-outlet></router-outlet>
</div>
