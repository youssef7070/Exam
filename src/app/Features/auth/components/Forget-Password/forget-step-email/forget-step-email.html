<div class="flex flex-col gap-2.5">
    <h1 class="Black-Text">Forgot Password</h1>
    <p class="text-gray-500 text-[16px] font-normal font-Geist-Mono">
        Don't worry, we will help you recover your account.
    </p>
</div>

<form class="flex flex-col gap-2.5 mt-2.5" (submit)="onSubmit($event)">

    <app-email label="Email" placeholder="user@example.com" [value]="email" [hasError]="emailError"
        (valueChange)="email = $event" (blurred)="onEmailBlur()">
    </app-email>


    @if (showGeneralError) {
    <div
        class="p-3 my-2 bg-red-50 border border-red-300 text-red-600 rounded-lg text-sm font-medium flex items-center gap-2">
        <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd" />
        </svg>
        <span>{{ errorMessage }}</span>
    </div>
    }

    <div class="mt-6 mb-9">
        <app-primary-button text="Next >" type="submit" [disabled]="isLoading"></app-primary-button>
    </div>

</form>

<p class="font-Geist-Mono text-center font-medium text-gray-500 text-[14px]">
    Don't have an account?
    <a routerLink="/register" class="text-[var(--main-blue)] ms-1.5 hover:underline">
        Create yours
    </a>
</p>
