<div class="auth-container flex flex-col md:flex-row min-h-screen w-full">

    <div class="auth-sidebar w-full md:flex-1">
        <app-fixed-side></app-fixed-side>
    </div>

    <div class="auth-content flex-1 flex flex-col justify-center items-center bg-white px-6 py-12 md:py-0">

        <div class="w-full max-w-[440px] flex flex-col gap-6">

            <div class="flex flex-col gap-2.5">
                <h1 class="Black-Text">Forgot Password</h1>
                <p class="text-gray-500 text-[16px] font-normal font-Geist-Mono">
                    Don't worry, we will help you recover your account.
                </p>
            </div>

            <form class="flex flex-col gap-2.5 mt-2.5" (submit)="onSubmit($event)">

                <app-email label="Email" placeholder="user@example.com" [value]="email" [hasError]="emailError"
                    (valueChange)="email = $event" (blurred)="onEmailBlur()">
                </app-email>

                <div class="mt-6 mb-9">
                    <app-primary-button text="Next >" type="submit" [routerLink]="['/message-reset-password']">
                    </app-primary-button>
                </div>

            </form>

            <p class="font-Geist-Mono text-center font-medium text-gray-500 text-[14px]">
                Don't have an account?
                <a routerLink="/register" class="text-[var(--main-blue)] ms-1.5 hover:underline">
                    Create yours
                </a>
            </p>

        </div>
    </div>
</div>
