<div class="flex mb-6 md:mb-10">
    <button type="button" routerLink="/forget-step-email"
        class="flex items-center justify-center w-10 h-10 border border-gray-200 cursor-pointer hover:bg-[#e6ecf3] transition-colors duration-200 focus:outline-none">
        <img src="/auth/move-left.svg" alt="" class="w-6 h-6">
    </button>
</div>

<div class="flex flex-col gap-4 font-Geist-Mono">
    <h1 class="Black-Text font-inter">Password Reset Sent</h1>

    <p class="text-gray-800 text-[16px]">
        We have sent a password reset link to:
        <a class="text-[var(--main-blue)] cursor-pointer font-normal hover:underline">
            {{ userEmail }}
        </a>
    </p>

    <p class="text-gray-800 text-[16px]">
        Please check your inbox and follow the instructions to reset your password.
    </p>

    <p class="text-[#94A3B8] text-[14px] leading-relaxed">
        If you don’t see the email within a few minutes, check your spam or junk folder.
    </p>
</div>

<p class="font-Geist-Mono font-medium text-gray-500 text-[14px] mt-8 md:mt-16">
    Don't have an account?
    <a routerLink="/register" class="cursor-pointer text-[var(--main-blue)] ms-1.5 hover:underline">
        Create yours
    </a>
</p>
