<h1 class="Black-Text mb-6">Login</h1>

<form (submit)="onSubmit($event)">
    <div class="flex flex-col gap-4">

        <app-user-name label="Username" placeholder="user123" [value]="username" [hasError]="usernameError"
            (valueChange)="username = $event" (blurred)="onUsernameBlur()">
        </app-user-name>

        <app-password label="Password" placeholder="********" [value]="password" [hasError]="passwordError"
            (valueChange)="password = $event" (blurred)="onPasswordBlur()">
        </app-password>

    </div>

    <div class="mt-2.5 w-full flex justify-end">
        <a [routerLink]="['/forget-step-email']"
            class="font-Geist-Mono text-[var(--main-blue)] text-[14px] font-medium hover:underline">
            Forgot your password?
        </a>
    </div>

    @if (showGeneralError) {
    <div
        class="mt-4 p-3 bg-red-50 border border-red-300 text-red-600 rounded-lg text-sm font-medium flex items-center gap-2">
        <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd" />
        </svg>
        <span>{{ errorMessage }}</span>
    </div>
    }

    <div class="mt-10">
        <app-primary-button text="Login" type="submit" [disabled]="isLoading">
        </app-primary-button>
    </div>
</form>

<p class="font-Geist-Mono text-center text-gray-500 text-[14px] mt-9 font-medium">
    Don't have an account?
    <a [routerLink]="['/register']" class="text-[var(--main-blue)] font-medium hover:underline">
        Create yours
    </a>
</p>
