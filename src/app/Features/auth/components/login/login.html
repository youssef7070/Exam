<div class="auth-container flex flex-col md:flex-row min-h-screen w-full">

    <div class="auth-sidebar w-full md:flex-1">
        <app-fixed-side></app-fixed-side>
    </div>

    <div class="auth-content flex-1 flex flex-col justify-center items-center bg-white px-6 py-12 md:py-0">

        <div class="w-full max-w-[452px] flex flex-col">

            <h1 class="Black-Text mb-6">Login</h1>

            <div class="flex flex-col gap-4">
                <app-user-name label="Username" placeholder="user123" [value]="username" [hasError]="usernameError"
                    (valueChange)="username = $event" (blurred)="onUsernameBlur()">
                </app-user-name>

                <app-password label="Password" placeholder="********" [value]="password" [hasError]="passwordError"
                    (valueChange)="password = $event" (blurred)="onPasswordBlur()">
                </app-password>
            </div>

            <a [routerLink]="['/forget-step-email']"
                class="font-Geist-Mono self-end mt-2.5 mb-10 text-[var(--main-blue)] text-[14px] font-medium hover:underline">
                Forgot your password?
            </a>

            @if (showGeneralError) {
            <div class="relative border border-[var(--errors)] bg-[#FFF5F5] rounded-sm py-3.5 px-4 mt-2 mb-6">
                <div
                    class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 rounded-full border border-[var(--errors)] bg-white flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="var(--errors)" class="w-3 h-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </div>
                <p class="text-center text-[var(--errors)] text-[14px] font-normal">Something went wrong</p>
            </div>
            }

            <app-primary-button text="Login" type="button" (onClick)="onSubmit()">
            </app-primary-button>

            <p class="font-Geist-Mono text-center text-gray-500 text-[14px] mt-9 font-medium">
                Don't have an account?
                <a [routerLink]="['/register']" class="text-[var(--main-blue)] font-medium hover:underline">
                    Create yours
                </a>
            </p>

        </div>
    </div>
</div>
