<div class="w-full max-w-[600px] flex flex-col gap-6 font-inter">

    <form (submit)="updatePassword($event)" class="flex flex-col gap-5">
        <app-password label="Current Password" placeholder="Enter current password" [value]="currentPasswordValue()"
            [hasError]="currentPasswordError()" [required]="true" (valueChange)="onCurrentPasswordValueChange($event)"
            (blurred)="onCurrentPasswordBlur()"></app-password>

        <app-password label="New Password" placeholder="Enter new password" [value]="newPasswordValue()"
            [hasError]="newPasswordError()" [required]="true" [errorMessage]="'Password must be at least 8 characters'"
            (valueChange)="onNewPasswordValueChange($event)" (blurred)="onNewPasswordBlur()"></app-password>

        <app-password label="Confirm Password" placeholder="Confirm your new password" [value]="confirmPasswordValue()"
            [hasError]="confirmPasswordError()" [required]="true" [errorMessage]="'Passwords do not match'"
            (valueChange)="onConfirmPasswordValueChange($event)" (blurred)="onConfirmPasswordBlur()"></app-password>

        @if (showGeneralError()) {
        <div class="p-3 bg-red-50 border border-red-300 text-red-600 rounded-lg text-sm font-medium">
            {{ errorMessage() }}
        </div>
        }

        @if (successMessage()) {
        <div class="p-3 bg-green-50 border border-green-300 text-green-700 rounded-lg text-sm font-medium">
            {{ successMessage() }}
        </div>
        }

        <div class="w-[220px] mt-2">
            <app-primary-button text="Update Password" type="submit" [disabled]="isLoading()"></app-primary-button>
        </div>
    </form>
</div>
