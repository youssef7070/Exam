<div class="w-[282px] md:h-[600px] flex flex-col justify-between p-6 gap-6">


    <!-- options -->

    <div class="w-full h-full flex flex-col gap-2.5">

        <!-- profile -->

        <a routerLink="/dashboard/settings/profile" routerLinkActive="bg-blue-100 font-semibold"
            class="flex flex-row items-center w-full py-2.5 px-4 gap-2.5 rounded-lg hover:bg-blue-50 transition-all duration-200 cursor-pointer decoration-transparent">

            <img src="/settings/circle-user-round.svg" alt="" srcset="" class="size-6">

            <p class="font-normal text-[16px] text-gray-500 font-inter">Profile</p>
        </a>

        <!--  change password -->

        <a routerLink="/dashboard/settings/change-password" routerLinkActive="bg-blue-100 font-semibold"
            class="flex flex-row items-center w-full py-2.5 px-4 gap-2.5 rounded-lg hover:bg-blue-50 transition-all duration-200 cursor-pointer decoration-transparent">

            <img src="/settings/lock.svg" alt="" srcset="" class="size-6">

            <p class="font-normal text-[16px] text-gray-500 font-inter">Change Password</p>
        </a>

    </div>


    <!-- log out -->

    <div class="mt-auto flex items-center ">

        <div class="flex bg-red-50 px-4 py-2.5 gap-2.5" (click)="logout()">

            <img src="/log-out.svg" alt="" class="size-[24px]">

            <p class="font-Geist-Mono font-normal text-[16px] text-red-600">Logout</p>

        </div>
    </div>



</div>
